apiVersion: apps/v1
kind: Deployment
metadata:
  name: workhub-app-deployment
  namespace: workhub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workhub-app
  template:
    metadata:
      labels:
        app: workhub-app
    spec:
      containers:
      - name: workhub-app
        image: workhub-saas:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: workhub-config
        env:
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workhub-secrets
              key: SPRING_DATASOURCE_PASSWORD
        - name: SPRING_RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workhub-secrets
              key: SPRING_RABBITMQ_PASSWORD
        - name: WORKHUB_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: workhub-secrets
              key: WORKHUB_JWT_SECRET
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: workhub-app-service
  namespace: workhub
spec:
  type: LoadBalancer
  selector:
    app: workhub-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
